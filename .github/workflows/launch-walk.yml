name: Weekly launch walk (live)

# Runs the end-to-end launch walk (signup → community → quiz → study party
# RSVP → whiteboard sync → PDF/image materials → review queue → saved folders)
# against the LIVE Supabase project once a week, so the primary journey stays
# verified after launch. The walk is self-cleaning — it creates two throwaway
# users and deletes all probe data (including storage files) when it finishes.
#
# Failure reporting: the job fails on any failed check (GitHub emails repo
# owners about failed scheduled runs), and an idempotent issue is opened or
# updated with the failing checks so there's a persistent record. The JSON
# report is uploaded as an artifact for inspection.
#
# Required repo secrets (without SUPABASE_SERVICE_ROLE_KEY the walk can't run —
# the job will fail loudly with "Missing env" rather than silently skip):
#   NEXT_PUBLIC_SUPABASE_URL       -> live project URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY  -> anon / publishable key
#   SUPABASE_SERVICE_ROLE_KEY      -> service role key (used only to create +
#                                     clean up the two test users)
#
# Manual runs: Actions → Weekly launch walk (live) → Run workflow.

on:
  schedule:
    # Monday 07:00 UTC — an hour before the weekly digest cron (08:00 UTC).
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write # report failures as an issue

jobs:
  walk:
    name: walk:launch → live
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The pipe keeps the step's exit code (runner uses `bash -e -o pipefail`),
      # so any failed check fails the job while tee captures the JSON report.
      - name: Run weekly launch walk
        id: walk
        run: npm run walk:launch -- --json 2>&1 | tee /tmp/walk-report.json

      - name: Upload report artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: launch-walk-report
          path: /tmp/walk-report.json

      - name: Report failure as an issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const raw = fs.readFileSync("/tmp/walk-report.json", "utf8");
            const title = "🚨 Weekly launch walk failed";

            let body;
            try {
              const report = JSON.parse(raw);
              const failed = (report.checks || []).filter((c) => !c.ok);
              const lines = failed.length
                ? failed.map((c) => `- **${c.name}** — ${c.detail || c.status}`).join("\n")
                : "_No individual check marked failed (walk errored before reporting)._";
              body = [
                `Weekly launch walk failed on ${report.checkedAt || "unknown time"}.`,
                "",
                `**${report.summary ? report.summary.ok + "/" + report.summary.total : "?"} checks passed.**`,
                "",
                lines,
              ].join("\n");
            } catch (e) {
              body = "Walk output was not a valid JSON report (likely a config/startup error):\n\n```\n" + raw.slice(0, 4000) + "\n```";
            }

            // Idempotent: find an existing open issue with this title and update
            // it instead of opening a duplicate every week.
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const found = existing.find((i) => i.title === title);
            if (found) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: found.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
